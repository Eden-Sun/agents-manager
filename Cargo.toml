[workspace]
members = ["daemon", "desktop", "xtask", "crates/am-core", "crates/am-ports", "crates/am-config", "crates/am-base", "crates/am-lifecycle", "crates/am-supervisor", "crates/am-share"]
# A bare `cargo build` / `cargo test` skips `desktop`: its tauri build script needs the
# `binaries/agents-managerd-<triple>` sidecar that only scripts/package-dmg.sh copies in.
# `tauri build` runs cargo inside desktop/, so packaging still builds it.
default-members = ["daemon", "xtask"]
resolver = "2"

[workspace.metadata.agents-manager.remote-cargo]
exclude = ["/web/node_modules"]

# 開發版（dev／test 繼承）只留行號表：workspace 自己的程式碼的 backtrace 仍有檔名與行號（外部依賴的 frame 不保證有），連結與 target 體積明顯變小（issue #1859）。
# 依賴套件不要除錯資訊（`debug = false`），它們的 debuginfo 只會拖慢連結。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "thin"
