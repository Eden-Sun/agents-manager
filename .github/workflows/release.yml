# 預編譯的 agents-managerd（UI 已嵌入）：推 v* tag 時建三個平台並發 GitHub Release；
# 手動觸發只建 artifact、不發 release（用來先試建置）。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: linux-arm64 }
          - { os: macos-14, target: aarch64-apple-darwin, asset: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build web UI
        working-directory: web
        run: bun install --frozen-lockfile && bun run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build daemon
        run: cargo build --release --locked -p agents-managerd --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="agents-managerd-${GITHUB_REF_NAME//\//-}-${{ matrix.asset }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/agents-managerd" LICENSE README.md README.zh-TW.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "PKG=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: dist/${{ env.PKG }}.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
