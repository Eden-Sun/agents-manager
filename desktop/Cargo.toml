[package]
name = "agents-manager-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop shell for agents-manager: boots agents-managerd and shows its UI in a native window."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
toml = "0.8"
dirs = "5"

[target.'cfg(unix)'.dependencies]
# Quit sends the daemon SIGTERM first: its graceful shutdown is what closes the ssh
# ControlMasters (SPEC §11.3.5), and `CommandChild::kill` is SIGKILL.
libc = "0.2"
