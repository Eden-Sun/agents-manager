<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA／網頁推播：iPhone 要「加入主畫面」以獨立視窗開啟才收得到推播。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AG Man" />
    <meta name="theme-color" content="#863bff" />
    <!-- 圖片只收同源、data:、blob:（issue #764）：遠端圖片要使用者點了才由 MarkdownImage fetch 成 blob，之後新增的渲染路徑也不能自動對外發請求。 -->
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Agents Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
