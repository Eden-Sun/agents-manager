[package]
name = "am-lifecycle"
version = "0.1.0"
edition = "2021"

[features]
# App-backed tests are compiled by agents-managerd's composition test harness.
daemon-test-harness = []

[dependencies]
am-base = { path = "../am-base" }
am-core = { path = "../am-core" }
am-ports = { path = "../am-ports" }
am-config = { path = "../am-config" }
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
toml_edit = { version = "0.22", features = ["serde"] }
toml = "0.8"
ulid = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
anyhow = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# flock(2)：同一個資料目錄只准一顆 daemon（startup.rs）
libc = "0.2"

[dev-dependencies]
am-base = { path = "../am-base", features = ["test-hooks"] }
# paused Tokio time for timer tests (lifecycle/queue.rs): same tokio crate, test builds only.
tokio = { version = "1", features = ["full", "test-util"] }
