[package]
name = "am-lifecycle"
version = "0.1.0"
edition = "2021"

[features]
default = ["embed-ui"]
# Enabled for the release build once `web/dist` exists (M8).
embed-ui = []
# App-backed tests are compiled by agents-managerd's composition test harness.
daemon-test-harness = []

[dependencies]
am-base = { path = "../am-base" }
am-core = { path = "../am-core" }
am-ports = { path = "../am-ports" }
am-config = { path = "../am-config" }
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
# 分享 bot 的 .svg well-formed 檢查（`share::svg_check`）；已經是 plist 的相依，不新增下載。
quick-xml = "0.41"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
toml_edit = { version = "0.22", features = ["serde"] }
toml = "0.8"
ulid = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
futures = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "5"
# flock(2)：同一個資料目錄只准一顆 daemon（startup.rs）
libc = "0.2"
# 分享入口把 SVG 引用的照片縮圖嵌成 data URI（share/compose.rs）。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[dev-dependencies]
am-base = { path = "../am-base", features = ["test-hooks"] }
# paused Tokio time for timer tests (lifecycle/queue.rs): same tokio crate, test builds only.
tokio = { version = "1", features = ["full", "test-util"] }
