[package]
name = "am-share"
version = "0.1.0"
edition = "2021"

[features]
# App-backed share tests are compiled by agents-managerd's composition test harness.
daemon-test-harness = []

[dependencies]
am-base = { path = "../am-base" }
am-lifecycle = { path = "../am-lifecycle" }
am-core = { path = "../am-core" }
am-ports = { path = "../am-ports" }
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tracing = "0.1"
anyhow = "1"
thiserror = "2"
futures = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
mime_guess = "2"
chrono = { version = "0.4", features = ["serde"] }
# flock(2)：同一個資料目錄只准一顆 daemon（startup.rs）
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[dev-dependencies]
am-base = { path = "../am-base", features = ["test-hooks"] }
# paused Tokio time for timer tests (lifecycle/queue.rs): same tokio crate, test builds only.
tokio = { version = "1", features = ["full", "test-util"] }
