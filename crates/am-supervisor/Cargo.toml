[package]
name = "am-supervisor"
version = "0.1.0"
edition = "2021"

[features]
# Compile App-backed tests for extracted modules in the daemon harness.
daemon-test-harness = []

[dependencies]
am-base = { path = "../am-base" }
am-lifecycle = { path = "../am-lifecycle" }
am-core = { path = "../am-core" }
am-ports = { path = "../am-ports" }
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
anyhow = "1"
thiserror = "2"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
# flock(2)：同一個資料目錄只准一顆 daemon（startup.rs）
libc = "0.2"

[dev-dependencies]
am-base = { path = "../am-base", features = ["test-hooks"] }
# paused Tokio time for timer tests (lifecycle/queue.rs): same tokio crate, test builds only.
tokio = { version = "1", features = ["full", "test-util"] }
